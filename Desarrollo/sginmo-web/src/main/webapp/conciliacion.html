<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Conciliación Bancaria Asistida</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#EEF1F7; --surface-3:#F8FAFC;
  --text:#141B2A; --muted:#5C6779; --faint:#8A93A4; --border:#E3E8F0; --border-2:#D3DAE6;
  --accent:#3B57D6; --accent-2:#5A72E0; --accent-weak:#E9EDFC;
  --ok:#0C9B6E; --ok-bg:#E4F6EF; --ok-line:#9FE0C7;
  --warn:#D97706; --warn-bg:#FBEEDD; --warn-line:#F1C58C;
  --none:#6B7688; --none-bg:#EDF0F5; --none-line:#CBD3DF;
  --risk:#DC2626; --risk-bg:#FBE7E7;
  --shadow:0 1px 2px rgba(18,26,42,.05),0 8px 24px -12px rgba(18,26,42,.14);
  --mono:ui-monospace,"SFMono-Regular","Cascadia Code",Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1119; --surface:#141C28; --surface-2:#1A2432; --surface-3:#111925;
  --text:#E7ECF4; --muted:#98A4B7; --faint:#6C788C; --border:#26313F; --border-2:#31404F;
  --accent:#7E97FF; --accent-2:#93A8FF; --accent-weak:#1D2842;
  --ok:#2FC48D; --ok-bg:#12261F; --ok-line:#1E4A38;
  --warn:#F0A64B; --warn-bg:#2A2013; --warn-line:#54401E;
  --none:#8A96A9; --none-bg:#1B2431; --none-line:#33414F;
  --risk:#F87171; --risk-bg:#2C1616;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#0C1119; --surface:#141C28; --surface-2:#1A2432; --surface-3:#111925;
  --text:#E7ECF4; --muted:#98A4B7; --faint:#6C788C; --border:#26313F; --border-2:#31404F;
  --accent:#7E97FF; --accent-2:#93A8FF; --accent-weak:#1D2842;
  --ok:#2FC48D; --ok-bg:#12261F; --ok-line:#1E4A38;
  --warn:#F0A64B; --warn-bg:#2A2013; --warn-line:#54401E;
  --none:#8A96A9; --none-bg:#1B2431; --none-line:#33414F;
  --risk:#F87171; --risk-bg:#2C1616;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* header */
header.top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(145deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;color:#fff;flex:none;box-shadow:var(--shadow)}
.logo svg{width:22px;height:22px}
.brand h1{font-size:19px;font-weight:680}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.spacer{flex:1 1 auto}
.pilltag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-weak);padding:5px 10px;border-radius:999px;align-self:center}

/* KPI row */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:13px 15px;box-shadow:var(--shadow)}
.kpi .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:25px;font-weight:700;margin-top:5px;letter-spacing:-.02em}
.kpi .sub{font-size:11.5px;color:var(--faint);margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.none{background:var(--none)} .dot.acc{background:var(--accent)}

/* stepper */
.stepper{display:flex;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:13px;
  padding:7px;margin-bottom:18px;box-shadow:var(--shadow);overflow-x:auto}
.step{flex:1 1 0;min-width:132px;display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;
  border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;white-space:nowrap;transition:.15s}
.step:hover{background:var(--surface-2)}
.step[aria-current="true"]{background:var(--accent-weak);color:var(--accent);border-color:transparent}
.step .n{width:22px;height:22px;border-radius:7px;background:var(--surface-2);color:var(--muted);
  display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.step[aria-current="true"] .n{background:var(--accent);color:#fff}
.step.done .n{background:var(--ok);color:#fff}
.step small{display:block;font-size:10.5px;font-weight:500;color:var(--faint)}
.step b{font-size:13px;font-weight:600}

/* cards / panels */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:15px;box-shadow:var(--shadow)}
.panel-h{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-h h2{font-size:15.5px;font-weight:660}
.panel-h .desc{color:var(--muted);font-size:12.5px;flex-basis:100%}
.panel-b{padding:18px}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:start}

/* buttons */
.btn{border:1px solid var(--border-2);background:var(--surface);color:var(--text);padding:9px 15px;border-radius:9px;
  font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:.13s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff} .btn.ok:hover{filter:brightness(1.07);color:#fff}
.btn.ghost-risk{color:var(--risk);border-color:var(--border-2)} .btn.ghost-risk:hover{border-color:var(--risk);color:var(--risk)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

/* dropzone */
.drop{border:1.5px dashed var(--border-2);border-radius:14px;padding:30px;text-align:center;background:var(--surface-3)}
.drop .fi{width:52px;height:52px;border-radius:13px;background:var(--accent-weak);color:var(--accent);display:grid;place-items:center;margin:0 auto 12px}
.drop .fi svg{width:26px;height:26px}
.filecard{display:flex;align-items:center;gap:14px;border:1px solid var(--border);border-radius:12px;padding:13px 15px;background:var(--surface-3);margin-top:14px}
.filecard .ic{width:40px;height:40px;border-radius:10px;background:var(--risk-bg);color:var(--risk);display:grid;place-items:center;flex:none}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 22px;margin-top:16px}
.meta div span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.meta div b{font-size:13.5px;font-weight:600}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:16px}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .25s}
.proglog{margin-top:12px;font-family:var(--mono);font-size:12px;color:var(--muted);min-height:20px}

/* OCR view */
.ocrtext{font-family:var(--mono);font-size:12.5px;line-height:1.85;background:var(--surface-3);border:1px solid var(--border);
  border-radius:11px;padding:15px;white-space:pre-wrap;overflow-x:auto;max-height:430px;overflow-y:auto}
.ocrtext .fix{background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:0 3px;font-weight:600}
.confbar{display:flex;align-items:center;gap:8px}
.confbar .track{height:6px;flex:1;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:44px}
.confbar .track>i{display:block;height:100%;border-radius:99px}
.conf-hi{background:var(--ok)} .conf-mid{background:var(--warn)} .conf-lo{background:var(--risk)}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:12.8px;min-width:720px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--surface-3);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.cr{color:var(--ok);font-weight:600} .db{color:var(--risk);font-weight:600}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.chip .dot{width:6px;height:6px}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.chip.none{background:var(--none-bg);color:var(--none);border-color:var(--none-line)}
.chip.risk{background:var(--risk-bg);color:var(--risk)}
.chip.acc{background:var(--accent-weak);color:var(--accent)}

/* conciliation columns */
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.bucket{background:var(--surface-3);border:1px solid var(--border);border-radius:13px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.bucket-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bucket-h b{font-size:13px;font-weight:660}
.bucket-h .cnt{font-size:12px;font-weight:700;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:2px 9px}
.mcard{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 12px;cursor:pointer;transition:.13s;border-left:3px solid var(--none-line)}
.mcard:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}
.mcard.b-ok{border-left-color:var(--ok)} .mcard.b-warn{border-left-color:var(--warn)} .mcard.b-none{border-left-color:var(--none)}
.mcard .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mcard .who{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .amt{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;flex:none}
.mcard .r2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:7px}
.mcard .r2 .date{font-size:11.5px;color:var(--faint);font-family:var(--mono)}
.scorepill{font-family:var(--mono);font-weight:700;font-size:11.5px;padding:2px 8px;border-radius:7px;background:var(--surface-2);color:var(--muted)}
.scorepill.hi{background:var(--ok-bg);color:var(--ok)} .scorepill.mid{background:var(--warn-bg);color:var(--warn)} .scorepill.lo{background:var(--none-bg);color:var(--none)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.44);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,94vw);background:var(--bg);border-left:1px solid var(--border);
  box-shadow:-16px 0 40px -20px rgba(0,0,0,.4);transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.2,1);z-index:50;
  display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.drawer-h h3{font-size:15px}
.iconbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{color:var(--text);border-color:var(--border-2)}
.drawer-b{padding:18px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.drawer-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:9px;flex-wrap:wrap;background:var(--surface)}

.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.side{border:1px solid var(--border);border-radius:12px;padding:13px;background:var(--surface)}
.side .tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--muted)}
.side .big{font-family:var(--mono);font-size:16px;font-weight:700;margin:5px 0 8px}
.side .row{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0;border-top:1px dashed var(--border)}
.side .row span{color:var(--muted)} .side .row b{font-weight:600;text-align:right}
.vsmid{display:grid;place-items:center;color:var(--faint)}

.scorebox{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.scorebox .top{padding:12px 14px;display:flex;align-items:center;gap:12px;background:var(--surface)}
.gauge{--v:0;width:58px;height:58px;border-radius:50%;flex:none;
  background:conic-gradient(var(--gc) calc(var(--v)*1%),var(--surface-2) 0);display:grid;place-items:center}
.gauge>i{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:15px;font-family:var(--mono);font-style:normal}
.scorebox .brk{border-top:1px solid var(--border);background:var(--surface-3)}
.brk .li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;font-size:12.5px;border-top:1px solid var(--border)}
.brk .li:first-child{border-top:0}
.brk .li .l{display:flex;align-items:center;gap:8px;color:var(--text)}
.brk .li .pts{font-family:var(--mono);font-weight:700}
.brk .li .pts.pos{color:var(--ok)} .brk .li .pts.zero{color:var(--faint)}
.tick{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;flex:none;font-size:11px;color:#fff}
.tick.y{background:var(--ok)} .tick.n{background:var(--none-line);color:var(--muted)}

.reason{background:var(--accent-weak);border:1px solid transparent;border-radius:12px;padding:14px}
.reason .h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;color:var(--accent);margin-bottom:7px}
.reason p{margin:0;font-size:13px;line-height:1.6}
.reason .risks{margin:9px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.reason .risks li{font-size:12px;color:var(--warn);display:flex;gap:7px;align-items:flex-start}
.reason .risks li::before{content:"▲";font-size:9px;margin-top:3px}
.aimeta{font-size:11px;color:var(--muted);margin-top:9px;font-family:var(--mono);display:flex;gap:10px;flex-wrap:wrap}

/* report */
.repgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.rc{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--surface-3)}
.rc .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.rc .v{font-size:24px;font-weight:700;margin-top:4px}
.summary{background:var(--surface-3);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:12px;padding:15px 17px;font-size:13.5px;line-height:1.7}
.summary b{color:var(--accent)}

.auditrow td{font-size:12px}
.auto-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px}
.auto-badge.a{background:var(--accent-weak);color:var(--accent)} .auto-badge.m{background:var(--surface-2);color:var(--muted)}

.hint{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:7px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);
  padding:11px 18px;border-radius:11px;font-size:13px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
@media (max-width:820px){ .kpis{grid-template-columns:repeat(2,1fr)} .grid2{grid-template-columns:1fr} .cols3{grid-template-columns:1fr} .vs{grid-template-columns:1fr;} .vsmid{transform:rotate(90deg)} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 7l3-3M20 17H4m16 0-3 3"/><circle cx="8.5" cy="12" r="1"/><circle cx="15.5" cy="12" r="1"/></svg></div>
      <div>
        <h1>Conciliación Bancaria Asistida</h1>
        <p>Importa un extracto · OCR + IA extraen y cruzan movimientos · vos aprobás</p>
      </div>
    </div>
    <div class="spacer"></div>
    <span class="pilltag">Demo · datos simulados</span>
  </header>

  <div class="kpis" id="kpis"></div>

  <nav class="stepper" id="stepper" aria-label="Flujo de conciliación"></nav>

  <main id="stage"></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Detalle de conciliación">
  <div class="drawer-h">
    <h3 id="dr-title">Detalle</h3><div class="spacer" style="flex:1"></div>
    <button class="iconbtn" id="dr-close" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="drawer-b" id="dr-body"></div>
  <div class="drawer-f" id="dr-foot"></div>
</aside>

<div class="toast" id="toast"></div>

<script>
"use strict";
const fmt = n => (n<0?"-":"") + Math.abs(n).toLocaleString("es-PY");
const gs  = n => n<0 ? "-"+Math.abs(n).toLocaleString("es-PY") : "+"+n.toLocaleString("es-PY");
const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const ndays = (a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const now = ()=>new Date(2026,7,18,9,12,0);
let clock = new Date(2026,7,18,9,12,0);
const stamp = ()=>{ clock = new Date(clock.getTime()+ (30+Math.floor(Math.random()*90))*1000);
  return clock.toLocaleDateString("es-PY")+" "+clock.toLocaleTimeString("es-PY",{hour:"2-digit",minute:"2-digit",second:"2-digit"}); };

/* ---------- datos de demo (falsos) ---------- */
const cuenta = {banco:"Banco Visión S.A.", numero:"0021-8845-01", moneda:"PYG", desc:"Cuenta corriente operativa"};

// movimientos internos del sistema (cobros/pagos ya registrados)
const internos = [
  {id:"INT-1042", fecha:"2026-08-10", concepto:"Cobro alquiler — Juan Pérez", referencia:"001245", tercero:"JUAN PEREZ", importe:1500000},
  {id:"INT-1043", fecha:"2026-08-10", concepto:"Pago a proveedor ACME S.A.", referencia:"", tercero:"ACME SA", importe:-850000},
  {id:"INT-1044", fecha:"2026-08-11", concepto:"Depósito efectivo en caja", referencia:"", tercero:"CAJA CENTRAL", importe:2000000},
  {id:"INT-1045", fecha:"2026-08-12", concepto:"Comisión bancaria mantenimiento", referencia:"COM0812", tercero:"BANCO VISION", importe:-55000},
  {id:"INT-1046", fecha:"2026-08-13", concepto:"Cobro alquiler — María Gómez", referencia:"", tercero:"MARIA GOMEZ", importe:730000},
  {id:"INT-1047", fecha:"2026-08-12", concepto:"Cobro — Carlos López", referencia:"007788", tercero:"CARLOS LOPEZ", importe:1200000},
  {id:"INT-1048", fecha:"2026-08-14", concepto:"Pago alquiler local comercial", referencia:"", tercero:"INMOB. DEL SUR", importe:-3500000},

/* ---------- motor de conciliación (reglas + score, real) ---------- */
const TOL = 0.005; // 0.5%
const PTS = {importe:40, importeTol:20, fechaExacta:20, fechaVentana:10, referencia:25, tercero:15, concepto:10};
function terceroEnDesc(t, desc){ const dn=norm(desc); return norm(t).split(" ").filter(w=>w.length>2).every(w=>dn.includes(w)); }
function conceptoSim(desc, concepto){ const a=new Set(norm(desc).split(" ").filter(w=>w.length>3)); const b=norm(concepto).split(" ").filter(w=>w.length>3);
  if(!b.length) return false; const hit=b.filter(w=>a.has(w)).length; return hit/b.length>=0.4; }

function scoreOne(m, i){
  const br=[]; let s=0;
  const dif=Math.abs(Math.abs(m.importe)-Math.abs(i.importe));
  const exacto = dif===0, tol = !exacto && dif<=Math.abs(i.importe)*TOL;
  if(exacto){ s+=PTS.importe; br.push(["Importe exacto",PTS.importe,true]); }
  else if(tol){ s+=PTS.importeTol; br.push(["Importe dentro de tolerancia (±0,5%)",PTS.importeTol,true]); }
  else { br.push(["Importe no coincide",0,false]); }
  const d=Math.abs(ndays(m.fecha,i.fecha));
  if(d===0){ s+=PTS.fechaExacta; br.push(["Fecha exacta",PTS.fechaExacta,true]); }
  else if(d<=3){ s+=PTS.fechaVentana; br.push(["Fecha dentro de ±3 días ("+d+"d)",PTS.fechaVentana,true]); }
  else { br.push(["Fecha fuera de ventana",0,false]); }
  const refOk = m.ref && i.referencia && norm(m.ref)===norm(i.referencia);
  if(refOk){ s+=PTS.referencia; br.push(["Referencia exacta ("+m.ref+")",PTS.referencia,true]); }
  else { br.push(["Referencia coincide",0,false]); }
  const terc = terceroEnDesc(i.tercero, m.rawFix||m.raw);
  if(terc){ s+=PTS.tercero; br.push(["Tercero coincide ("+i.tercero+")",PTS.tercero,true]); }
  else { br.push(["Tercero coincide",0,false]); }
  const con = conceptoSim(m.rawFix||m.raw, i.concepto);
  if(con){ s+=PTS.concepto; br.push(["Concepto similar",PTS.concepto,true]); }
  else { br.push(["Concepto similar",0,false]); }
  return {score:s, br, dif};
}

function claseScore(s){ return s>=85?"auto":(s>=60?"revision":"sin"); }

// construye conciliaciones (best candidate) respetando "no conciliado previamente"
function conciliar(){
  const usados=new Set(); const out=[];
  movs.forEach(m=>{
    let best=null;
    internos.forEach(i=>{
      if(i.importe==null) return;
      const sameSign = (m.importe<0)===(i.importe<0);
      const dif=Math.abs(Math.abs(m.importe)-Math.abs(i.importe));
      if(dif>Math.abs(i.importe)*TOL) return;            // regla dura: importe (con tolerancia)
      if(!sameSign) return;                               // débito con débito / crédito con crédito
      const r=scoreOne(m,i);
      if(!best || r.score>best.score) best={i,...r};
    });
    let estado, matchId=null, razon, riesgos=[], decision;
    if(!best){ estado="sin"; decision="sin_match"; razon="No se encontró ningún movimiento interno con importe y moneda compatibles dentro de la ventana de fechas."; }
    else{
      const dup = best.i.id && usados.has(best.i.id);
      if(dup){ estado="revision"; decision="revision"; matchId=best.i.id;
        razon="El importe y concepto coinciden con "+best.i.id+", que ya fue conciliado con otro movimiento del extracto. Posible movimiento duplicado en el banco.";
        riesgos.push("Posible duplicado: mismo importe y concepto que "+m.dupOf+".");
      } else {
        const cls=claseScore(best.score);
        estado = cls==="auto"?"auto":(cls==="revision"?"revision":"sin");
        decision = cls==="auto"?"auto":(cls==="revision"?"revision":"sin_match");
        if(estado!=="sin") usados.add(best.i.id);
        // razón IA
        const partes=best.br.filter(b=>b[2]).map(b=>b[0].replace(/\s*\(.*\)/,"").toLowerCase());
        razon = "Coincide por "+partes.join(", ")+". Score "+best.score+"/100 → "+
                (estado==="auto"?"conciliación automática.":(estado==="revision"?"sugerido para revisión manual.":"sin coincidencia."));
        const dd=Math.abs(ndays(m.fecha,best.i.fecha));
        if(dd>0 && dd<=3) riesgos.push("La fecha difiere "+dd+" día"+(dd>1?"s":"")+" respecto del registro interno.");
        if(m.conf<0.8) riesgos.push("Confianza OCR baja ("+m.conf.toFixed(2)+"): verificar importe y referencia.");
        if(!best.br.find(b=>b[0].startsWith("Referencia")&&b[2]) && estado==="revision") riesgos.push("Sin referencia común; el match se apoya en importe, fecha y tercero.");
      }
    }
    out.push({id:"C-"+m.id, mov:m, match:best?best.i:null, matchId, score:best?best.score:0, br:best?best.br:[], estado, decision, razon, riesgos,
      // estado de conciliación (propuesta/aprobada/…)
      concEstado: estado==="auto"?"aprobada":(estado==="revision"?"propuesta":"sin"),
      aprobadoPor: estado==="auto"?"Motor IA":null});
  });
  return out;
}

  vs.innerHTML=`
    <div class="side"><div class="tag">Movimiento bancario</div><div class="big ${m.importe>=0?'cr':'db'}">${gs(m.importe)}</div>
      <div class="row"><span>Fecha</span><b class="mono">${m.fecha}</b></div>
      <div class="row"><span>Descripción</span><b>${m.rawFix||m.raw}</b></div>
      <div class="row"><span>Referencia</span><b class="mono">${m.ref||"—"}</b></div>
      <div class="row"><span>Confianza OCR</span><b>${m.conf.toFixed(2)}</b></div></div>
    <div class="vsmid"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 7h11m0 0-3-3m3 3-3 3M16 17H5m0 0 3-3m-3 3 3 3"/></svg></div>
    <div class="side">${ i? `<div class="tag">Candidato interno</div><div class="big">${fmt(i.importe)}</div>
      <div class="row"><span>Registro</span><b class="mono">${i.id}</b></div>
      <div class="row"><span>Fecha</span><b class="mono">${i.fecha}</b></div>
      <div class="row"><span>Concepto</span><b>${i.concepto}</b></div>
      <div class="row"><span>Tercero</span><b>${i.tercero}</b></div>
      <div class="row"><span>Referencia</span><b class="mono">${i.referencia||"—"}</b></div>`
      : `<div class="tag">Candidato interno</div><div style="display:grid;place-items:center;height:80%;color:var(--faint);gap:8px;text-align:center;padding-top:10px">
         <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
         <div style="font-size:12.5px">Sin candidato interno<br>con importe compatible</div></div>`}</div>`;
  body.appendChild(vs);
  // score
  const sc=c.score, gc = sc>=85?"var(--ok)":(sc>=60?"var(--warn)":"var(--none)");
  const sb=el("div","scorebox");
  const label = c.estado==="auto"?"Conciliación automática":(c.estado==="revision"?"Sugerido para revisión":"Sin coincidencia");
  sb.innerHTML=`<div class="top"><div class="gauge" style="--v:${sc};--gc:${gc}"><i style="color:${gc}">${sc}</i></div>
    <div><div style="font-weight:700;font-size:14px">${label}</div><div class="hint">Score de confianza sobre 100 · umbral automático 85</div></div></div>
    <div class="brk">${ c.br.length? c.br.map(b=>`<div class="li"><span class="l"><span class="tick ${b[2]?'y':'n'}">${b[2]?'✓':'·'}</span>${b[0]}</span><span class="pts ${b[1]>0?'pos':'zero'}">${b[1]>0?'+'+b[1]:'0'}</span></div>`).join("") : `<div class="li"><span class="l">Sin candidato para evaluar reglas</span></div>`}</div>`;
  body.appendChild(sb);
  // reasoning
  const rz=el("div","reason");
  rz.innerHTML=`<div class="h"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0-4 10.5V17h8v-3.5A6 6 0 0 0 12 3z"/><path d="M9 21h6M10 17v4M14 17v4"/></svg>Razonamiento de la IA</div>
    <p>${c.razon}</p>${ c.riesgos.length?`<ul class="risks">${c.riesgos.map(r=>`<li>${r}</li>`).join("")}</ul>`:"" }
    <div class="aimeta"><span>modelo: gpt-4o (sim)</span><span>prompt: matching-v1</span><span>decisión: ${c.decision}</span></div>`;
  body.appendChild(rz);
  // footer actions
  const f=$("#dr-foot"); f.innerHTML="";
  if(c.estado==="sin"){
    f.appendChild(el("span","hint","Sin candidato: podés buscar manualmente o dejar como excepción."));
  } else if(c.concEstado==="aprobada"){
    f.appendChild(chipInfo("Aprobada por "+(c.aprobadoPor||"—")));
    f.appendChild(mkBtn("Anular","ghost-risk",()=>act(c,"anulada")));
  } else if(c.concEstado==="rechazada"){
    f.appendChild(chipInfo("Rechazada"));
    f.appendChild(mkBtn("Reabrir","",()=>act(c,"reabrir")));
  } else {
    f.appendChild(mkBtn("Aprobar","ok",()=>act(c,"aprobada"),"M5 12l4 4L19 7"));
    f.appendChild(mkBtn("Corregir","",()=>act(c,"corregida")));
    f.appendChild(mkBtn("Rechazar","ghost-risk",()=>act(c,"rechazada")));
  }
  $("#scrim").classList.add("on"); $("#drawer").classList.add("on");
}
function chipInfo(t){ return el("span","chip ok",`<span class="dot ok"></span>${t}`); }
function mkBtn(label,cls,fn,path){ const b=el("button","btn "+cls, (path?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="${path}"/></svg>`:"")+label); b.onclick=fn; return b; }
function closeDrawer(){ $("#scrim").classList.remove("on"); $("#drawer").classList.remove("on"); }

function act(c, accion){
  const ant=c.concEstado;
  const map={aprobada:"aprobada",rechazada:"rechazada",corregida:"corregida",anulada:"pendiente",reabrir:"propuesta"};
  const nuevo=map[accion];
  c.concEstado = accion==="anulada"?"propuesta":(accion==="reabrir"?"propuesta":nuevo);
  if(accion==="aprobada"||accion==="corregida"){ c.aprobadoPor="usuario.demo"; c.estado="auto"; }
  if(accion==="rechazada"){ c.aprobadoPor=null; c.estado="revision"; }
  if(accion==="anulada"||accion==="reabrir"){ c.aprobadoPor=null; c.estado="revision"; }
  S.audit.push({entidad:"conciliacion", eid:c.id, accion:"acción manual: "+accion, ant, nuevo:c.concEstado,
    usuario:"usuario.demo", auto:false, score:c.score, modelo:"—", ts:stamp(),
    razon: accion==="corregida"?"El usuario corrigió y aceptó el emparejamiento propuesto.":"Revisión manual del operador."});
  const labels={aprobada:"Conciliación aprobada",corregida:"Conciliación corregida y aprobada",rechazada:"Conciliación rechazada",anulada:"Conciliación anulada",reabrir:"Conciliación reabierta"};
  toast(labels[accion]||"Actualizado");
  closeDrawer(); renderStepper(); renderStage();
}

/* ---------- reporte + auditoría ---------- */
function stReport(){
  const p=el("section","panel");
  p.innerHTML=`<div class="panel-h"><h2>5 · Reporte final y auditoría</h2><div class="desc">Resumen del proceso y traza completa: quién hizo qué, cuándo, con qué score y si intervino la IA.</div></div>`;
  const b=el("div","panel-b"); b.style.display="flex"; b.style.flexDirection="column"; b.style.gap="18px";
  const c=counts();
  const dif = movs.reduce((a,m)=>a+m.importe,0);
  const summary=el("div","summary");
  summary.innerHTML=`Se importó el extracto <b>${S.extracto.nombre}</b> (${S.extracto.tipo}). Se extrajeron <b>${movs.length} movimientos</b> por OCR + IA.
    <b>${c.auto}</b> fueron conciliados automáticamente, <b>${c.rev}</b> quedaron para revisión y <b>${c.sin}</b> sin coincidencia.
    Cada conciliación tiene score, explicación de la IA y auditoría. Aprobadas hasta ahora: <b>${c.aprob}</b> · ${fmt(c.montoOk)} ₲.`;
  b.appendChild(summary);
  const grid=el("div","repgrid");
  [["Total movimientos",movs.length],["Conciliados (aprobados)",c.aprob],["En revisión",c.rev],["Sin coincidencia",c.sin],["Monto conciliado ₲",fmt(c.montoOk)]]
    .forEach(r=>{ const rc=el("div","rc"); rc.innerHTML=`<div class="l">${r[0]}</div><div class="v tnum">${r[1]}</div>`; grid.appendChild(rc); });
  b.appendChild(grid);
  b.appendChild(el("div","",`<div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center">
    <button class="btn" onclick="expSim('PDF')"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>Exportar PDF</button>
    <button class="btn" onclick="expSim('Excel/CSV')"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3v4a1 1 0 0 0 1 1h4M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2zM8 13h8M8 17h5"/></svg>Exportar Excel/CSV</button>
    <span class="hint">exportación simulada en la demo</span></div>`));
  // auditoria
  const auw=el("div"); auw.innerHTML=`<div style="font-weight:660;font-size:14px;margin:6px 0 10px">Traza de auditoría <span class="chip acc" style="margin-left:6px">${S.audit.length} eventos</span></div>`;
  const wrap=el("div","tbl-wrap"); const t=el("table");
  t.innerHTML=`<thead><tr><th>Fecha/hora</th><th>Entidad</th><th>Acción</th><th>Estado</th><th>Usuario</th><th>Modo</th><th style="text-align:right">Score</th></tr></thead>`;
  const tb=el("tbody");
  [...S.audit].reverse().forEach(a=>{
    const tr=el("tr","auditrow");
    tr.innerHTML=`<td class="mono">${a.ts}</td><td class="mono">${a.eid}</td><td>${a.accion}</td>
      <td><span class="mono" style="color:var(--muted)">${a.ant}</span> → <b class="mono">${a.nuevo}</b></td>
      <td>${a.usuario}</td><td><span class="auto-badge ${a.auto?'a':'m'}">${a.auto?'IA / auto':'manual'}</span></td>
      <td class="num tnum">${a.score||"—"}</td>`;
    tr.title=(a.modelo!=="—"?"modelo: "+a.modelo+" · ":"")+a.razon;
    tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t); auw.appendChild(wrap);
  b.appendChild(auw);
  p.appendChild(b); return [p];
}
function expSim(f){ toast("Exportación "+f+" generada (simulada en la demo)"); }

/* toast */
let tt; function toast(m){ const el=$("#toast"); el.textContent=m; el.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("on"),2200); }

/* wiring */
$("#dr-close").onclick=closeDrawer; $("#scrim").onclick=closeDrawer;
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDrawer(); });
window.go=go; window.expSim=expSim;
bootConc(); renderStepper(); renderStage();
</script>

</body>
</html>
